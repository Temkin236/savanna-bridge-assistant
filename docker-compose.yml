name: savanna-bridge-assistant

services:
  api:
    build:
      context: ./api
    command: uvicorn savanna_bridge.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      ADDIS_API_KEY: ${ADDIS_API_KEY:-}
      CLOUD_AI_API_KEY: ${CLOUD_AI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_HOST: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-only}
      SECRET_KEY: ${TOKEN_SECRET:-local-development-only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173,http://localhost:8080},http://demo-host,http://console
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/savanna_bridge.db}
      DB_PATH: /data/savanna_bridge.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_API_SECRET: ${BOT_API_SECRET:-change-me-bot-secret}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-savannah_assistant3_bot}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - ./api/src:/app/src:ro
      - ./api/adapters:/app/adapters:ro
      - ./api/tests:/app/tests:ro
      - ./api/openapi.yaml:/app/openapi.yaml:ro
      - ./api/pyproject.toml:/app/pyproject.toml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  mock-api:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 --no-multiprocess /tmp/openapi.yaml
    volumes:
      - ./api/openapi.yaml:/tmp/openapi.yaml:ro
    ports:
      - "${MOCK_API_PORT:-4010}:4010"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12

  bot:
    build:
      context: ./channels/bot
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-savannah_assistant3_bot}
      BOT_API_SECRET: ${BOT_API_SECRET:-change-me-bot-secret}
      SMS_DRIVER: ${SMS_DRIVER:-mock}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./tests:/tests:ro
      - ./channels/bot:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  console:
    image: nginx:1.27-alpine
    volumes:
      - ./channels/console:/usr/share/nginx/html:ro
    ports:
      - "${CONSOLE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health.html"]
      interval: 5s
      timeout: 3s
      retries: 12

  demo-host:
    build:
      context: .
      dockerfile: demo-host/Dockerfile
    ports:
      - "${DEMO_PORT:-4173}:80"
    volumes:
      - ./demo-host:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health.html"]
      interval: 5s
      timeout: 3s
      retries: 12

  accessibility-tests:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: [test]
    working_dir: /work
    volumes:
      - ./:/work
    command: /bin/bash -lc "npm ci --prefix tests && npm run verify --prefix tests"
    environment:
      DEMO_BASE_URL: http://demo-host
      CONSOLE_BASE_URL: http://console
      PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      demo-host:
        condition: service_healthy
      console:
        condition: service_healthy

  channels-tests:
    build:
      context: ./channels/bot
    profiles: [test]
    env_file:
      - .env
    working_dir: /work
    volumes:
      - ./channels:/work:ro
    command: /bin/sh -lc "pip install --no-cache-dir pytest && pytest -q"

  ollama:
    image: ollama/ollama:0.5.4
    profiles: [ollama]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  app-data:
  ollama-data:

