<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Jobs</title>
  </head>
  <body>
    <main>
      <h1>Community Jobs</h1>
      <article>
        <h2>Customer Support Assistant</h2>
        <p>Addis Ababa - full time</p>
        <p>Help customers by phone and chat.</p>
      </article>
    </main>
    <bridge-assistant data-api="http://localhost:8000" data-course="jobs" data-lang="en"></bridge-assistant>
    <script type="module" src="/widget/widget.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const apiParam = params.get("api");
      if (apiParam) {
        document.querySelectorAll("bridge-assistant").forEach((el) => el.setAttribute("data-api", apiParam));
      }
    </script>
    <!-- This generic host proves the architecture is not Savanna-specific. -->
  </body>
</html>
